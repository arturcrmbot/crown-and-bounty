# Copilot's cloud agent (the factory) runs this job's steps on its runner before it starts work, outside
# its firewall. The firewall blocks the private Azure Artifacts feed that package-lock.json installs every
# package from, so these steps install them first, and Playwright's Chromium as CI's play job does, for
# CHANNEL=bundled. The agent reads this file from main only. It runs here on a pull request that changes
# it, and by hand, never on a push (the repo is private: minutes count).
name: Copilot setup steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Copilot only runs a job with exactly this name.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # No timeout-minutes: the agent's own work runs in this job too, so it would cap the factory's session.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The same cache as CI's play job.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
