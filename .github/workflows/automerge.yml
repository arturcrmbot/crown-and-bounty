# Factory PRs merge themselves once CI is green; CI then runs on main and deploys.
#
# A PR merges when it has the `factory` label and no `hold`, isn't a draft, targets main, was opened by
# the factory's bot, doesn't touch .github/, LICENSE, scripts/deploy.mjs or the package files, can merge
# cleanly, and CI's PR jobs passed on its current head. The factory runs as Copilot's cloud agent, whose
# PRs are opened by the `Copilot` bot (its REST login); if the first factory PR shows another login, add
# it to FACTORY_BOTS. A PR that fails a check a person must settle (the author or the files) gets `hold`
# and a comment saying why; the rest just wait for the next run.
#
# A merge made with GITHUB_TOKEN doesn't start the push run on main, so this dispatches CI on main
# afterwards, and CI deploys on dispatch. It never checks out or runs the PR's code.
name: Auto-merge factory PRs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [unlabeled, ready_for_review]

permissions: {}

# One at a time. Each run checks every open factory PR, so a run that replaces a waiting one loses nothing.
concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge green factory PRs
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'pull_request_target'
        && (github.event.action == 'ready_for_review'
          || (github.event.action == 'unlabeled' && github.event.label.name == 'hold')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FACTORY_BOTS: |
        Copilot
        copilot-swe-agent[bot]
      CI_WORKFLOW: ci.yml
      REQUIRED_JOBS: |
        Typecheck, unit tests, build
        The bot plays whole commissions
        Play-through and playtests
      PROTECTED: ^(\.github/|LICENSE|scripts/deploy\.mjs$|package\.json$|package-lock\.json$)
    steps:
      - name: Merge the factory PRs that are ready
        run: |
          set -euo pipefail
          merged=0
          failed=0
          say() { echo "$*"; echo "- $*" >> "$GITHUB_STEP_SUMMARY"; }
          hold() {
            gh api -X POST "repos/$GH_REPO/issues/$1/labels" -f 'labels[]=hold' > /dev/null
            gh api -X POST "repos/$GH_REPO/issues/$1/comments" \
              -f body="Not merging this automatically: $2. Merge it by hand if it's fine." > /dev/null
          }

          for n in $(gh pr list --state open --label factory --json number --jq '.[].number'); do
            pr=$(gh api "repos/$GH_REPO/pulls/$n")
            sha=$(jq -r .head.sha <<< "$pr")
            author=$(jq -r .user.login <<< "$pr")

            if jq -e 'any(.labels[]; .name == "hold")' <<< "$pr" > /dev/null; then say "#$n: on hold"; continue; fi
            if [ "$(jq -r .draft <<< "$pr")" = true ]; then say "#$n: still a draft"; continue; fi
            base=$(jq -r .base.ref <<< "$pr")
            if [ "$base" != main ]; then say "#$n: targets $base, not main"; continue; fi

            if ! grep -qxF -- "$author" <<< "$FACTORY_BOTS" || [ "$(jq -r .user.type <<< "$pr")" != Bot ]; then
              say "#$n: opened by $author, not the factory's bot"
              hold "$n" "it was opened by \`$author\`, not the factory's bot"
              continue
            fi

            files=$(gh api --paginate "repos/$GH_REPO/pulls/$n/files?per_page=100" \
              --jq '.[] | "\(.filename)\t\(.previous_filename // "")"')
            if [ "$(grep -c . <<< "$files" || true)" -lt "$(jq -r .changed_files <<< "$pr")" ]; then
              say "#$n: too many files to check"
              hold "$n" "it changes more files than the API lists, so I can't check them"
              continue
            fi
            touched=$(tr '\t' '\n' <<< "$files" | grep -E -- "$PROTECTED" | sort -u | paste -sd ' ' - || true)
            if [ -n "$touched" ]; then
              say "#$n: changes $touched"
              hold "$n" "it changes $touched"
              continue
            fi

            run=$(gh api "repos/$GH_REPO/actions/workflows/$CI_WORKFLOW/runs?head_sha=$sha&event=pull_request&per_page=100" \
              --jq '.workflow_runs | max_by(.created_at) // empty | "\(.id) \(.status) \(.conclusion // "")"')
            read -r run_id status conclusion <<< "$run" || true
            if [ -z "${run_id:-}" ]; then say "#$n: no CI run on ${sha:0:7} yet"; continue; fi
            if [ "$status" != completed ] || [ "$conclusion" != success ]; then
              say "#$n: CI is ${conclusion:-$status} on ${sha:0:7}"
              continue
            fi
            green=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.conclusion == "success") | .name')
            missing=""
            while IFS= read -r job; do
              if [ -n "$job" ] && ! grep -qxF -- "$job" <<< "$green"; then missing="${missing:+$missing, }$job"; fi
            done <<< "$REQUIRED_JOBS"
            if [ -n "$missing" ]; then say "#$n: not green on ${sha:0:7}: $missing"; continue; fi

            mergeable=$(jq -r .mergeable <<< "$pr")
            for _ in 1 2 3 4 5 6; do
              if [ "$mergeable" != null ]; then break; fi
              sleep 5
              mergeable=$(gh api "repos/$GH_REPO/pulls/$n" --jq .mergeable)
            done
            if [ "$mergeable" != true ]; then say "#$n: can't merge cleanly into main"; continue; fi

            # The sha pins the merge to the commit CI passed: if the branch moved since, GitHub refuses.
            if gh api -X PUT "repos/$GH_REPO/pulls/$n/merge" -f merge_method=squash -f sha="$sha" > /dev/null; then
              say "#$n: merged ${sha:0:7}"
              merged=1
            else
              say "#$n: the merge failed (see the log)"
              failed=1
            fi
          done

          if [ "$merged" = 1 ]; then
            gh workflow run "$CI_WORKFLOW" --ref main
            say "CI started on main; it deploys when it's green."
          fi
          exit "$failed"
