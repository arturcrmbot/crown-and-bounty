# Every pull request gets typecheck, the build and the fast unit tests, the bot playing whole
# commissions (only when it changes src/rules or src/content), and the play-through (by mouse, and by
# touch on a phone); the playtest per background runs on main only. These are the three checks main's ruleset
# requires, and the session that opened the PR squash-merges it once they're green. Main, on a push
# (a merge) or a dispatch, gets typecheck, the build and the fast unit tests, which gate the deploy to
# GitHub Pages, then the play-through and the balance report. The visual scenes only run by hand
# (Run workflow > visual), on a Mac, where they were approved. If main breaks, an issue labelled `ci`
# opens itself, and closes when main is green. The repo is private: minutes count, so nothing here
# runs twice for one commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      visual:
        description: Compare the frozen scenes too (a Mac runner, 10x the minutes)
        type: boolean
        default: false
      bot:
        description: Run the bot's whole-commission tests too
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    # -eo pipefail, so a step piped through `tee` still fails when its command does.
    shell: bash

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Main's build is the live site: only it gets the visitor counter's site code (#157), from the
      # repository variable GOATCOUNTER_CODE. Every other build, and every play-through, counts nothing.
      - run: npx vite build
        env:
          VITE_GOATCOUNTER_CODE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GOATCOUNTER_CODE || '' }}
      - run: npm run test:fast -- --maxWorkers=2
      - name: Size of the build
        run: |
          {
            echo "### Build"
            echo "| | |"
            echo "| --- | --- |"
            echo "| JavaScript | $(du -ch dist/assets/*.js | tail -1 | cut -f1) |"
            echo "| Everything | $(du -sh dist | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; a newer push waiting in line replaces an older one.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  bot:
    name: The bot plays whole commissions
    # Minutes long, so it runs on pull requests (before they merge) and by hand, not again on main.
    if: github.event_name == 'pull_request' || inputs.bot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: bot-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only a change to the rules or the content can change how the bot plays: a UI, art, sound or
      # docs change skips the run (8 minutes), and the check still passes (Artur, 30 Sep).
      - name: Does this change touch the rules or the content?
        id: touches
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(src/rules/|src/content/|package-lock\.json)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change to src/rules or src/content: the bot's whole commissions are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.touches.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.touches.outputs.run == 'true'
      - run: npm run test:bot
        if: steps.touches.outputs.run == 'true'

  play:
    name: Play-through and playtests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: play-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Playwright's own Chromium: CI has no Edge.
      CHANNEL: bundled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Play the first commission through the real UI
        run: npm run e2e 2>&1 | tee e2e.txt
      - name: Play the first commission by touch, on a phone
        if: always()
        # The opening, the rails, a fight by hand and the hero screen, by touch; the whole commission is `npm run phone`, locally.
        run: QUICK=1 npm run phone 2>&1 | tee phone.txt
      - name: Playtest the opening with each background
        # A report, never a failure: on main only, so a pull request's check takes minutes less.
        if: always() && github.event_name != 'pull_request'
        run: |
          for bg in "Knight of the Realm" "Hedge Wizard" "Ranger of the Greenwood" "Courtier"; do
            slug=$(echo "$bg" | cut -d' ' -f1 | tr 'A-Z' 'a-z')
            BG="$bg" node scripts/playtest.mjs > "playtest-$slug.txt" 2>&1 || true
            if [ -d screenshots/playtest ]; then mv screenshots/playtest "screenshots/playtest-$slug"; fi
          done
      - name: Report
        if: always()
        run: |
          {
            echo "### Play-through"
            echo '```'
            grep -E "^(ok|FAIL)" e2e.txt | tail -60 || true
            echo '```'
            echo "### Played by touch, on a phone"
            echo '```'
            grep -E "^(ok|FAIL)" phone.txt | tail -80 || true
            echo '```'
            echo "### Playtests"
            for f in playtest-*.txt; do [ -e "$f" ] || continue; echo "- **${f#playtest-}**: $(tail -1 "$f")"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtests
          path: |
            screenshots/
            playtest-*.txt
            e2e.txt
            phone.txt
          retention-days: 14

  visual:
    name: Visual scenes (report)
    # Scenes were approved on a Mac, so they're drawn on one here too; it only reports, and only by hand.
    if: inputs.visual
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    concurrency:
      group: visual-${{ github.ref }}
      cancel-in-progress: true
    env:
      CHANNEL: bundled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Compare frozen scenes with test/visual.json
        run: npm run visual 2>&1 | tee visual.txt
      - name: Report
        if: always()
        run: |
          { echo "### Visual scenes"; echo '```'; cat visual.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-scenes
          path: screenshots/visual/
          retention-days: 14

  balance:
    name: Balance report
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    concurrency:
      group: balance-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: The bot plays all five commissions with every background
        run: npm run sim -- 1 --campaign 2>&1 | tee sim.txt
      - name: Difficulty targets
        if: always()
        run: npm run difficulty 2>&1 | tee difficulty.txt
      - name: Report
        if: always()
        run: |
          {
            echo "### Campaign, played by the bot"; echo '```'; grep -v "^>" sim.txt | sed '/^$/d' || true; echo '```'
            echo "### Difficulty (a ! is outside its target)"; echo '```'; grep -v "^>" difficulty.txt | sed '/^$/d' || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  alert:
    name: Issue when main breaks
    needs: [check, play]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK: ${{ needs.check.result }}
          PLAY: ${{ needs.play.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="Main is broken"
          open=$(gh issue list --state open --label ci --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          what=""
          [ "$CHECK" = failure ] && what="typecheck, the unit tests or the build"
          [ "$PLAY" = failure ] && what="${what:+$what, }the play-through"
          if [ -n "$what" ]; then
            body=$(printf 'Commit %s broke %s.\n\nRun: %s' "${SHA:0:7}" "$what" "$RUN")
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "$title" --label ci --label bug --body "$body"; fi
          elif [ "$CHECK$PLAY" = successsuccess ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "Green again at ${SHA:0:7}: $RUN"
          fi
