name: Feature
description: An idea to make the game better.
labels: [feature]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it's fun
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we'll know it's in the game.
